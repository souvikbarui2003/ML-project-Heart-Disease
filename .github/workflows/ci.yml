name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: |
          ruff check src/ api/ tests/

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short -m "not slow" --ignore=tests/test_api.py

  build-and-train:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train model
        run: |
          python -m src.train

      - name: Run tests including API
        run: |
          pip install -r requirements-dev.txt
          pytest tests/ -v --tb=short

      - name: Build Docker image
        run: |
          docker build -t heart-disease-api:${{ github.sha }} .

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-train
    if: github.ref == 'refs/heads/main'
    # Add deployment steps here as needed
    steps:
      - name: Deploy placeholder
        run: echo "Ready for deployment configuration"

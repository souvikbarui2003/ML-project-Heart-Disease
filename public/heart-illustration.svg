<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ee5a24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c44569;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="heartShine" x1="0%" y1="0%" x2="50%" y2="50%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#fff;stop-opacity:0" />
    </linearGradient>
    <filter id="heartShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#c44569" flood-opacity="0.4"/>
    </filter>
    <filter id="heartGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Main Heart -->
  <path d="M100 180 C60 140, 10 100, 10 60 C10 30, 40 10, 70 10 C85 10, 95 20, 100 30 C105 20, 115 10, 130 10 C160 10, 190 30, 190 60 C190 100, 140 140, 100 180Z" 
        fill="url(#heartGrad)" filter="url(#heartShadow)"/>
  <!-- Shine -->
  <path d="M70 35 C50 35, 25 50, 25 65 C25 75, 35 85, 50 75 C60 68, 70 50, 70 35Z" 
        fill="url(#heartShine)" opacity="0.6"/>
  <!-- Pulse rings -->
  <circle cx="100" cy="90" r="50" fill="none" stroke="#ff6b6b" stroke-width="1.5" opacity="0.2">
    <animate attributeName="r" values="50;70;50" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="90" r="60" fill="none" stroke="#ee5a24" stroke-width="1" opacity="0.15">
    <animate attributeName="r" values="60;85;60" dur="2s" repeatCount="indefinite" begin="0.3s"/>
    <animate attributeName="opacity" values="0.2;0;0.2" dur="2s" repeatCount="indefinite" begin="0.3s"/>
  </circle>
  <!-- ECG line -->
  <path d="M30 150 L60 150 L70 130 L80 170 L90 140 L100 155 L110 145 L120 150 L170 150" 
        fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6">
    <animate attributeName="stroke-dashoffset" values="200;0" dur="2s" repeatCount="indefinite"/>
    <set attributeName="stroke-dasharray" to="200"/>
  </path>
</svg>
